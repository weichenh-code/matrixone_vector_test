version: '3.8'

services:
  gpu-test:
    image: rapidsai/rapidsai:24.02-cuda11.8-runtime-ubuntu22.04-py3.10
    # 或者使用自己构建的镜像:
    # build: .
    # image: gpu-kmeans-test:latest
    
    runtime: nvidia
    
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    
    volumes:
      - .:/workspace
    
    working_dir: /workspace
    
    stdin_open: true
    tty: true
    
    command: /bin/bash
